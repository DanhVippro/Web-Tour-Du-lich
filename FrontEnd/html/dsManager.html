<!doctype html>
<html lang="en" data-bs-theme="light">

<head>
    <title>Cheap Tour</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS v5.3.8 -->
    <link href="/FrontEnd/css/bootstrap.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/FrontEnd/css/manager.css">
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col sidebar">
                <div class="img-wraper"><img src="/data/img/Logo.png" alt=""></div>
                <ul>
                    <li>
                        <a href="" class="menu-link">
                            <i class="bi bi-calendar"></i>
                            <span>Booking</span>
                        </a>
                    </li>

                    <li>
                        <a href="" class="menu-link">
                            <i class="bi bi-clock"></i>
                            <span>Lịch trình</span>
                        </a>
                    </li>

                    <li>
                        <a href="" class="menu-link">
                            <i class="bi bi-graph-up"></i>
                            <span>Phân tích</span>
                        </a>
                    </li>

                    <li>
                        <a href="" class="menu-link">
                            <i class="bi bi-chat"></i>
                            <span>Message</span>
                        </a>
                    </li>

                    <li>
                        <a href="" class="menu-link">
                            <i class="bi bi-globe"></i>
                            <span>Tour</span>
                        </a>
                    </li>
                </ul>
                <button class="btn btn-warning">+ Add new Tour</button>
                <div class="account">
                    <div><img src="/data/img/logo-login.png" alt=""></div>
                    <div class="nameAccount">
                        <p class="name">John Doe</p>
                        <p class="role">Manager</p>
                    </div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-10 p-4">

                <!-- Header -->
                <div class="dashboard-header mb-4">
                    <h1 style="color: #1a8fbf; font-family: serif;">
                        Welcome Manager !</h1>

                    <div class="row">
                        <!-- Col 8: boxes + search -->
                        <div class="col-8">
                            <div class="row mb-3">
                                <div class="col">
                                    <div class="box box-blue">
                                        <h3>Total booking: 1000</h3>
                                        <p>View all ></p>
                                        <p>aaaaaaaaa</p>
                                    </div>
                                </div>
                                <div class="col">
                                    <div class="box box-blue">
                                        <h3>Upcoming Tours: 50</h3>
                                        <p>View all ></p>
                                        <p>aaaaaaa</p>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="search-wrapper">
                                    <input class="search-box w-75" placeholder="Search tour">
                                </div>
                            </div>
                        </div>

                        <!-- Col 4: calendar -->
                        <div class="col-4">
                            <div class="calendar">
                                <div class="calendar-header">
                                    <button onclick="prevMonth()">◀</button>
                                    <h3 id="monthYear"></h3>
                                    <button onclick="nextMonth()">▶</button>
                                </div>
                                <!-- Dùng 1 grid cho cả label + dates -->
                                <div class="days-grid" id="calGrid">
                                    <div class="day-label">CN</div>
                                    <div class="day-label">T2</div>
                                    <div class="day-label">T3</div>
                                    <div class="day-label">T4</div>
                                    <div class="day-label">T5</div>
                                    <div class="day-label">T6</div>
                                    <div class="day-label">T7</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Content -->
                <div class="row">
                    <!-- Left -->
                    <div class="col-md-8">
                        <div class="d-flex align-items-center mb-2">
                            <b>Danh sách</b>
                            <div style="flex:1; height:2px; background:black; margin:0 10px;"></div>
                            <small>View all ></small>
                        </div>

                        <div class="list-item"></div>
                        <div class="list-item"></div>
                        <div class="list-item"></div>
                        <div class="list-item"></div>
                    </div>

                    <!-- Right -->
                    <div class="col-md-4">
                        <div class="right-box">
                            Upcoming tour<br>+ hình ảnh
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>


    <!-- Bootstrap JavaScript Bundle (includes Popper) -->
    <script src="/BackEnd/js/bootstrap.bundle.js"></script>
    <script src="/BackEnd/js/dsManager.js"></script>
</body>

</html>
