    <script>
    const bookings = JSON.parse(localStorage.getItem("bookings") || "[]");
    const list = document.getElementById("booking-list");

    if (bookings.length === 0) {
        list.innerHTML = `
            <div class="text-center py-5 text-muted">
                <p style="font-size:18px">😕 Bạn chưa đặt tour nào!</p>
                <a href="../html/Dattour.html" class="btn btn-primary">Đặt tour ngay</a>
            </div>`;
    } else {
        bookings.reverse().forEach(bk => {
            // Xác định trạng thái
            const today = new Date().toISOString().split("T")[0];
            let trangThai = "";
            let btnClass = "status-btn";

            if (bk.departureDate > today) {
                trangThai = "⏳ Sắp khởi hành";
                btnClass += " btn-sapdi";
            } else {
                trangThai = "✅ Đã hoàn thành";
                btnClass += " btn-xong";
            }

            list.innerHTML += `
                <div class="tour-card">
                    <div class="d-flex align-items-center">
                        <div>
                            <h4 class="fw-bold tittle">${bk.tourName}</h4><br>
                            <p>Mã đặt: #${bk.id}</p>
                            <p class="mb-1">📅 Khởi hành: ${formatDate(bk.departureDate)}</p>
                            <p class="mb-1">🎟 Số vé: ${bk.adultTickets} người lớn${bk.childTickets ? " + " + bk.childTickets + " trẻ em" : ""}</p>
                            <p class="mb-0 text-danger">💰 Tổng tiền: ${formatPrice(bk.totalPrice)}</p>
                        </div>
                    </div>
                    <button type="button" class="${btnClass}">${trangThai}</button>
                </div>`;
        });
    }

    function formatDate(dateStr) {
        const [y, m, d] = dateStr.split("-");
        return `${d}/${m}/${y}`;
    }

    function formatPrice(price) {
        return price.toLocaleString("vi-VN") + " đ";
    }
</script>
